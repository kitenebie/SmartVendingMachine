<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font:15px system-ui;max-width:1000px;margin:auto;padding:20px;background:#f8fafc}section{background:white;padding:18px;margin:12px 0;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}input,button{padding:8px;margin:3px}button{background:#2563eb;color:white;border:0;border-radius:4px}</style>
<h1>Machine administration</h1><button onclick="logout()">Log out</button><section><h2>Users</h2><table><thead><tr><th>Email</th><th>Role</th><th>Credits</th><th>Override</th></tr></thead><tbody id="users"></tbody></table></section><section><h2>Products (maximum four actuator slots)</h2><form id="product"><input id="name" placeholder="Name" required><input id="cost" type="number" min="0" placeholder="Credits" required><input id="stock" type="number" min="0" placeholder="Stock" required><button>Add</button></form><table><tbody id="products"></tbody></table></section><section><h2>Dispense log</h2><pre id="log"></pre></section><script src="/js/auth.js"></script><script>const $=id=>document.getElementById(id),load=async()=>{const u=await api('/api/admin/users');$('users').innerHTML=u.users.map(x=>`<tr><td>${x.email}</td><td>${x.role}</td><td>${x.credits}</td><td><button onclick="credit('${x.id}')">Set</button></td></tr>`).join('');const p=await api('/api/products');$('products').innerHTML=p.products.map(x=>`<tr><td>${x.name}</td><td>${x.credit_cost}</td><td>${x.stock}</td><td><button onclick="removeProduct('${x.id}')">Delete</button></td></tr>`).join('');$('log').textContent=JSON.stringify(await api('/api/admin/log'),null,2)};async function credit(id){const n=prompt('New credit balance');if(n!==null)await api('/api/admin/credits',{method:'POST',body:JSON.stringify({user_id:id,credits:Number(n)})});load()}async function removeProduct(id){await api('/api/products?id='+encodeURIComponent(id),{method:'DELETE'});load()}product.onsubmit=async e=>{e.preventDefault();await api('/api/products',{method:'POST',body:JSON.stringify({name:name.value,credit_cost:Number(cost.value),stock:Number(stock.value)})});e.target.reset();load()};load().catch(()=>location.href='/login.html');</script>
