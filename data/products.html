<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Products — Inventory System</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="app-page">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#2563EB"/>
          <path d="M10 14h20M10 20h20M10 26h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>Inventory</span>
      </div>
      <button class="sidebar-close" id="sidebarClose">&#x2715;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/products.html" class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Products
      </a>
      <a href="/configuration.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.68 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Configuration
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item nav-logout" id="logoutBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <h2 class="topbar-title">Products</h2>
      <div class="topbar-user">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="topbarUsername">Admin</span>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div>
          <h1>Products</h1>
          <p class="text-muted">Manage your product inventory</p>
        </div>
        <button class="btn btn-primary" id="addProductBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Product
        </button>
      </div>

      <div id="toastContainer"></div>

      <div class="card">
        <div class="table-responsive">
          <table class="table" id="productsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Product Name</th>
                <th class="text-right">Stocks</th>
                <th class="text-right">Bottles Required</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="productBody">
              <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ====== Add/Edit Modal ====== -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Product</h3>
        <button class="modal-close" id="modalClose">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div id="modalAlert" class="alert hidden"></div>
        <form id="productForm" novalidate>
          <input type="hidden" id="productId"/>
          <div class="form-group">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name" required/>
            <span class="field-error" id="nameErr"></span>
          </div>
          <div class="form-group">
            <label for="productStocks">Stocks</label>
            <input type="number" id="productStocks" placeholder="0" min="0" step="1" required/>
            <span class="field-error" id="stocksErr"></span>
          </div>
          <div class="form-group">
            <label for="productPrice">Required Bottles (pcs)</label>
            <input type="number" id="productPrice" placeholder="1" min="0" step="1" required/>
            <span class="field-error" id="priceErr"></span>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelModalBtn">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn">Save Product</button>
      </div>
    </div>
  </div>

  <!-- ====== Delete Confirm Modal ====== -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>Delete Product</h3>
        <button class="modal-close" id="deleteModalClose">&#x2715;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteProductName"></strong>?</p>
        <p class="text-muted text-sm">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
