<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User portal</title><style>body{font:16px system-ui;max-width:760px;margin:auto;padding:20px;background:#f8fafc}section{background:white;padding:20px;margin:12px 0;border-radius:10px}button{padding:9px;margin:4px;background:#2563eb;color:white;border:0;border-radius:5px}.credit{font-size:42px;font-weight:bold}li{margin:10px 0}.modal{position:fixed;inset:0;background:#0008;color:#fff;display:none;place-items:center}.modal>div{background:#111827;padding:30px;border-radius:12px;text-align:center}</style>
<h1>My recycling account</h1><button onclick="logout()">Log out</button><section><div>Credits</div><div class="credit" id="credits">—</div><button id="insert">Insert bottle</button></section><section><h2>Redeem</h2><ul id="products"></ul></section><section><h2>Change password</h2><form id="password"><input id="current" type="password" placeholder="Current password" required><input id="next" type="password" placeholder="New password" minlength="8" required><button>Change password</button></form></section><div class="modal" id="modal"><div><h2>Drop the bottle</h2><p><span id="seconds">60</span>s remaining</p><button id="done">Done</button></div></div>
<script src="/js/auth.js"></script><script>let timer;const $=id=>document.getElementById(id),refresh=async()=>{const d=await api('/api/me');$('credits').textContent=d.user.credits;const p=await api('/api/products');$('products').innerHTML=p.products.map(x=>`<li>${x.name} — ${x.credit_cost} credits (${x.stock} left) <button onclick="redeem('${x.id}')">Redeem</button></li>`).join('')};async function redeem(id){const qty=Number(prompt('Quantity',1));if(!qty)return;try{await api('/api/redeem',{method:'POST',body:JSON.stringify({product_id:id,qty})});refresh()}catch(e){alert(e.message)}}insert.onclick=async()=>{try{await api('/api/session/start',{method:'POST'});modal.style.display='grid';timer=setInterval(async()=>{const d=await api('/api/session/status');seconds.textContent=d.seconds_remaining;if(!d.locked||d.seconds_remaining===0)done.click()},1000)}catch(e){alert(e.message)}};done.onclick=async()=>{clearInterval(timer);modal.style.display='none';await api('/api/session/end',{method:'POST'}).catch(()=>{});refresh()};password.onsubmit=async e=>{e.preventDefault();try{await api('/api/user/password',{method:'POST',body:JSON.stringify({current_password:current.value,new_password:next.value})});alert('Password changed')}catch(x){alert(x.message)}};refresh().catch(()=>location.href='/login.html');</script>
