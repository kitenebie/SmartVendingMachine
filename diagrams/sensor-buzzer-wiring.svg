<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 bottle sensors and LCD status wiring</title>
  <desc id="desc">Bottle sensor outputs connect to ESP32 GPIO pins. The existing 20 by 4 I2C LCD displays bottle storage status.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#374151}
      .title{font-size:34px;font-weight:700;fill:#1e40af}
      .subtitle{font-size:18px;fill:#64748b}
      .section{font-size:20px;font-weight:700;fill:#1e40af}
      .label{font-size:17px;font-weight:700}
      .detail{font-size:16px}
      .small{font-size:14px;fill:#64748b}
      .board{fill:#dbeafe;stroke:#1e3a5f;stroke-width:3}
      .sensor{fill:#93c5fd;stroke:#1e3a5f;stroke-width:2}
      .lcd{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .credits{fill:#a7f3d0;stroke:#047857;stroke-width:2}
      .signal{fill:none;stroke:#1e3a5f;stroke-width:4}
      .alert{fill:none;stroke:#c2410c;stroke-width:4}
      .ground{fill:none;stroke:#64748b;stroke-width:4}
      .pin{fill:#fff;stroke:#1e3a5f;stroke-width:2}
    </style>
  </defs>
  <rect width="1680" height="1120" fill="#ffffff"/>
  <text x="64" y="68" class="title">ESP32 · Bottle Sensors + LCD Status</text>
  <text x="66" y="105" class="subtitle">Default pin map in this project · classic ESP32 DevKit V1 · USB connector at bottom</text>

  <text x="72" y="165" class="section">SENSOR SIGNALS</text>
  <rect x="64" y="190" width="390" height="78" rx="13" class="sensor"/>
  <rect x="64" y="290" width="390" height="78" rx="13" class="sensor"/>
  <rect x="64" y="390" width="390" height="78" rx="13" class="sensor"/>
  <rect x="64" y="490" width="390" height="78" rx="13" class="sensor"/>
  <text x="88" y="222" class="label">Sensor C · size</text>
  <text x="88" y="247" class="detail">OUT signal → GPIO 2</text>
  <text x="88" y="322" class="label">Sensor D · size</text>
  <text x="88" y="347" class="detail">OUT signal → GPIO 15</text>
  <text x="88" y="422" class="label">Sensor A · upper / trigger</text>
  <text x="88" y="447" class="detail">OUT signal → GPIO 34</text>
  <text x="88" y="522" class="label">Sensor B · lower / trigger</text>
  <text x="88" y="547" class="detail">OUT signal → GPIO 35</text>

  <rect x="540" y="155" width="545" height="495" rx="28" class="board"/>
  <rect x="675" y="255" width="275" height="270" rx="24" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="812" y="294" text-anchor="middle" class="label">ESP32-WROOM</text>
  <text x="812" y="325" text-anchor="middle" class="small">38-pin DevKit layout</text>
  <text x="812" y="461" text-anchor="middle" class="small">USB connector ↓</text>
  <text x="555" y="184" class="section">ESP32 DEVKIT</text>
  <text x="556" y="216" class="small">LEFT HEADER · top to bottom</text>
  <text x="956" y="216" class="small">RIGHT HEADER</text>

  <!-- The four input pins are drawn in their DevKitC-style left-header order. -->
  <circle cx="540" cy="290" r="8" class="pin"/><circle cx="540" cy="340" r="8" class="pin"/>
  <circle cx="540" cy="390" r="8" class="pin"/><circle cx="540" cy="440" r="8" class="pin"/>
  <text x="558" y="296" class="label">GPIO 2 · C</text>
  <text x="558" y="346" class="label">GPIO 15 · D</text>
  <text x="558" y="396" class="label">GPIO 34 · A</text>
  <text x="558" y="446" class="label">GPIO 35 · B</text>

  <!-- Signal leads map by GPIO number; use the pin labels printed on the board. -->
  <path d="M454 229 H540 V290" class="signal"/>
  <path d="M454 329 H540 V340" class="signal"/>
  <path d="M454 429 H540 V390" class="signal"/>
  <path d="M454 529 H540 V440" class="signal"/>
  <circle cx="454" cy="229" r="5" fill="#1e3a5f"/><circle cx="454" cy="329" r="5" fill="#1e3a5f"/>
  <circle cx="454" cy="429" r="5" fill="#1e3a5f"/><circle cx="454" cy="529" r="5" fill="#1e3a5f"/>

  <text x="1105" y="165" class="section">20×4 I2C LCD</text>
  <rect x="1165" y="190" width="450" height="300" rx="20" class="lcd"/>
  <rect x="1200" y="235" width="380" height="165" rx="12" fill="#163a25"/>
  <text x="1230" y="285" class="detail" style="fill:#d8f3b2">The Machine is Full</text>
  <text x="1230" y="330" class="detail" style="fill:#d8f3b2">Storage: 100 / 100</text>
  <text x="1200" y="445" class="label">SDA → GPIO 23 · SCL → GPIO 22</text>

  <rect x="64" y="610" width="735" height="160" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="90" y="650" class="label">Sensor power and safe signal levels</text>
  <text x="90" y="686" class="detail">All sensor GND wires → ESP32 GND (shared ground).</text>
  <text x="90" y="716" class="detail">Sensor OUT must be ≤ 3.3 V; level-shift any 5 V output.</text>
  <text x="90" y="746" class="small">Add 10 kΩ pull-downs to GPIO 34/35; GPIO 2/15 are boot-strapping pins.</text>

  <rect x="830" y="610" width="785" height="160" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="856" y="650" class="label">Full storage display</text>
  <text x="856" y="686" class="detail">At 100 bottles, the LCD shows “The Machine is Full”.</text>
  <text x="856" y="716" class="detail">After an admin resets storage, it returns to the ready message.</text>
  <text x="856" y="746" class="detail">No buzzer wiring or GPIO is required.</text>

  <rect x="64" y="820" width="1551" height="220" rx="18" class="credits"/>
  <text x="96" y="866" class="section" style="fill:#047857">BOTTLE CREDIT RULE</text>
  <text x="96" y="910" class="detail">Tap Finish session while the size sensors are lit; the door opens after credits save, then closes after 10 seconds.</text>
  <text x="112" y="970" class="label">A + B  →  1 credit</text>
  <text x="560" y="970" class="label">A + B + C  →  3 credits</text>
  <text x="1090" y="970" class="label">A + B + C + D  →  5 credits</text>
</svg>
